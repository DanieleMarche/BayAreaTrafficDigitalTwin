services:
  # KRaft handles the coordination (no separate Zookeeper needed)
  kafka:
    image: apache/kafka:latest
    container_name: digital_twin_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      # PLAINTEXT: clients on the host (localhost:9092)
      # DOCKER: other containers on the compose network (kafka:29092), e.g. kafka-ui
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,DOCKER://kafka:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      # Single broker: internal topics must use replication factor 1
      # (default is 3, which makes __consumer_offsets creation fail)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      # Never delete messages by age: records carry 2017 event-time timestamps
      KAFKA_LOG_RETENTION_MS: -1

  # Web UI to browse topics and messages: http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: digital_twin_kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: digital-twin
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  influxdb:
    image: influxdb:3-core
    container_name: digital_twin_influxdb
    ports:
      - "8181:8181"
    command: 
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=memory
      - --without-auth
